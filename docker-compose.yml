services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aiquest
      POSTGRES_USER: aiquest
      POSTGRES_PASSWORD: aiquest
    volumes:
      - aiquest-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiquest -d aiquest"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    working_dir: /service
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://aiquest:aiquest@postgres:5432/aiquest
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PUBLIC_APP_URL: http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  aiquest-postgres:
